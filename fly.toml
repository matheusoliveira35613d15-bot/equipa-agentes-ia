app = "equipa-agentes-ia-matheus"
primary_region = "lhr"

[build]

[env]
  DATA_DIR = "/persist"

[mounts]
  source = "equipa_agentes_dados"
  destination = "/persist"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
